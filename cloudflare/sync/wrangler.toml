name = "celestine-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "SYNC"
bucket_name = "celestine-sync"

# the site Worker (the celestine-site repository), which answers every path that is not the API's (worker.js: site);
# `wrangler dev -c wrangler.toml -c <a celestine-site checkout>/wrangler.toml` runs both, with the binding between them
[[services]]
binding = "SITE"
service = "celestine-site"

# the id is that of the live database; `wrangler dev --local` uses a local copy, whatever it says
[[d1_databases]]
binding = "DB"
database_name = "celestine"
database_id = "d5ad1d9a-3bed-4344-a7b9-0576f5848d82"

# Used by `wrangler dev` (secrets from .dev.vars). The live Worker is deployed by deploy.sh, which sets the secrets:
#   ADMIN_TOKEN        the administrator's key (the /admin page)
#   CF_ANALYTICS_TOKEN, CF_ACCOUNT_ID   optional: the admin panel's dashboard (analytics.js) reads Cloudflare's figures
#                      with this API token, which can only read analytics (Account Analytics: Read, Zone Analytics: Read)
#   RESEND_API_KEY     mail; MAIL_FROM is its sender ("Celestine <davet@resend.halid.dev>"); without a key the code is shown in /admin
#   TURNSTILE_SECRET   the bot check of the waitlist form (its public half, TURNSTILE_SITEKEY, is the site Worker's)
#   ADMIN_EMAIL        optional: told of a new signup

# the daily pass that deletes the old tombstones (worker.js: scheduled)
[triggers]
crons = ["17 3 * * *"]
