name = "celestine-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "SYNC"
bucket_name = "celestine-sync"

# the releases, read for the /changelog page only (changelog.js): the release workflow writes changelog.json there
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "celestine-releases"

# the id is that of the live database; `wrangler dev --local` uses a local copy, whatever it says
[[d1_databases]]
binding = "DB"
database_name = "celestine"
database_id = "d5ad1d9a-3bed-4344-a7b9-0576f5848d82"

# Used by `wrangler dev` (secrets from .dev.vars). The live Worker is deployed by deploy.sh, which sets the secrets:
#   ADMIN_TOKEN        the administrator's key (the /admin page)
#   RESEND_API_KEY     mail; MAIL_FROM is its sender ("Celestine <davet@resend.halid.dev>"); without a key the code is shown in /admin
#   TURNSTILE_SECRET   the bot check of the waitlist form; TURNSTILE_SITEKEY is its public half
#   ADMIN_EMAIL, CONTACT_EMAIL   optional: told of a new signup / shown on the waitlist page
#   DOWNLOAD_URL       the update Worker's /download (cloudflare/update), where the entry screen's buttons lead

# the daily pass that deletes the old tombstones (worker.js: scheduled)
[triggers]
crons = ["17 3 * * *"]
