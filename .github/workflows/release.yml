# A tag v1.2.3 makes a release: the five builds (scripts/build.sh, with its size budget), packaged
# (scripts/package.sh: macOS as a zipped celestine.app, Linux also as a .tar.gz with a .desktop file, and
# scripts/appimage.sh: Linux as an AppImage, #513) and a SHA256SUMS. Then the dmg job, on macOS, makes
# celestine-macos.dmg from the two darwin zips (scripts/dmg.sh): the first install, for both Macs (#479). macOS minutes count ten times; it takes a minute or two.
# Last, the publish job adds the DMG to SHA256SUMS and signs it with the release's key (SHA256SUMS.sig, which
# scripts/install.sh checks, #540), signs the manifest, checks both with the public key the programs are built with,
# makes the GitHub release, and puts the files on Cloudflare R2, from where the app's update check reads them
# (cloudflare/update/worker.js), and the site's download buttons through the Worker's /download: the DMG on macOS,
# the AppImage on Linux, the .exe on Windows. Every file goes up once, signed sums before the manifest, and
# update.json last: until it is there, no app and no install script is offered the version. A DMG that could not be
# made does not hold the release back: it goes up without one.
#
# Secrets: RELEASE_KEY (the secret key of `go run ./scripts/release keygen`), UPDATE_PUBLIC_KEY (its public
# half, which goes into the program), UPDATE_URL (the Worker's address, https://…/update.json; the files are served
# beside it), and for R2: CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. Without them the release is
# made all the same, on GitHub alone: the builds do not check for updates, and nothing goes to R2.
#
# A v0.x tag, or one with a "-" (v1.2.0-beta.1), is a prerelease. The notes, on GitHub and in the app's "what's
# new" alike, are the commits since the tag before. changelog.json, every release with its changes, the new apart from
# the fixes and without issue numbers (scripts/release changelog), goes to R2 last: the site's /changelog reads it
# there, with no deploy. An annotated tag gives the release its title and summary on that page:
#   git tag -a v1.2.0 -m "Quieter sync" -m "Sync asks the server less, and ..."
#
# The tests run here only for a commit the nightly has not tested whole: one it has (its status celestine/tests,
# nightly.yml) is not tested again, and the release is its builds alone (#465). To release a fix quickly, run the
# nightly on it by hand (`gh workflow run nightly.yml`) and tag it once that passed.
# The key is the publish job's alone (#174): the build job, which runs the tests (all of the dependencies' code)
# and builds, has no secret that signs and only reads the repository, and the dmg job neither. The publish job runs
# in the environment "release" (its protection rules, and RELEASE_KEY as its own secret, are set in the repository's
# settings), runs only scripts/release (the standard library alone) with the key, which it reads from the environment
# and never writes to a file, and uses no action that is not GitHub's own. Every action is pinned by its commit.
#
name: release
on:
  push:
    tags: ["v*"]
permissions: {} # each job asks for what it needs
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read # whether the nightly tested the commit (tested already)
    env:
      VERSION: ${{ github.ref_name }}
      SIGNED: ${{ secrets.UPDATE_PUBLIC_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - name: tested already
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the nightly's mark on this very commit: what it tested is not run again
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            --jq '[.[] | select(.context == "celestine/tests")][0].state // ""' 2>/dev/null || true)
          if [ "$state" = success ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "The nightly tested $GITHUB_SHA whole: its tests are not run again."
          else
            echo "The nightly has not tested $GITHUB_SHA: the tests run here."
          fi
      - name: format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: test
        if: steps.tested.outputs.ok != 'true'
        run: go test -timeout 20m ./...
      - name: update address
        if: env.SIGNED == 'true'
        env:
          UPDATE_URL: ${{ secrets.UPDATE_URL }} # the address and the public key, which go into the programs: nothing that signs
          UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: |
          # a signed release with no address would sign files no app can find
          case "$UPDATE_URL" in https://*/update.json) ;; *) echo "UPDATE_URL is not https://…/update.json"; exit 1 ;; esac
          echo "LDFLAGS=-X main.updateURL=$UPDATE_URL -X main.updateKey=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: build
        env:
          BUDGET_MB: 50 # the builds are 27-31 MB (v0.1.0); over this the release stops
        run: |
          scripts/build.sh
          GOOS=js GOARCH=wasm go build -o /dev/null . # the web's build is in the gate too
          ls -l dist
      - name: package
        run: |
          scripts/package.sh
          scripts/appimage.sh
          (cd dist && sha256sum celestine-* > SHA256SUMS && cat SHA256SUMS)
      - name: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "Since $prev:" > release-notes.md
            git log --no-merges --format='- %s' "$prev..$VERSION" >> release-notes.md
          else
            echo "The first release. The latest changes:" > release-notes.md
            git log --no-merges --format='- %s' -40 "$VERSION" >> release-notes.md
          fi
          cat release-notes.md
      - name: changelog
        run: |
          # every release from the tags, for the site's /changelog (src/routes/changelog of the celestine-site repository)
          go run ./scripts/release changelog > changelog.json
          head -c 2000 changelog.json
      - name: darwin zips for the dmg job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin
          path: dist/celestine-darwin-*.zip
          retention-days: 1
      - name: files for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            dist/celestine-*
            dist/SHA256SUMS
            release-notes.md
            changelog.json
          retention-days: 1
  dmg:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: darwin, path: dist }
      - name: dmg
        run: scripts/dmg.sh
      - name: the dmg for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg
          path: dist/celestine-macos.dmg
          retention-days: 1
  publish:
    needs: [build, dmg]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
    env:
      VERSION: ${{ github.ref_name }}
      SIGNED: ${{ secrets.RELEASE_KEY != '' }}
      R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
      UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
      UPDATE_URL: ${{ secrets.UPDATE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release, path: . }
      - name: the dmg
        if: needs.dmg.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dmg, path: dist }
      - name: sign
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          # the DMG is in SHA256SUMS too (#540)
          if [ -f dist/celestine-macos.dmg ]; then (cd dist && sha256sum celestine-macos.dmg >> SHA256SUMS); fi
          cat dist/SHA256SUMS
          channel=
          case "$VERSION" in *-*) channel=beta ;; esac
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          [ "$SIGNED" = true ] || exit 0
          go build -o release-tool ./scripts/release # the standard library alone
          # a tag with a "-" (v1.2.0-beta.1) is a trial: its manifest says so, and it goes up as beta.json only (#169).
          # Every file is signed three times: sig and sig2 for the clients released before #168, sig3 (with the channel
          # and the notes) for those since; the clients of each check their own
          ./release-tool manifest -version "$VERSION" -base "${UPDATE_URL%/update.json}/$VERSION" -channel "$channel" \
            -notes release-notes.md -key env:RELEASE_KEY dist/celestine-* > update.json
          # signed with the key the app checks its updates with: the install script checks it (scripts/release/sums.go)
          ./release-tool sums -version "$VERSION" -channel "$channel" -key env:RELEASE_KEY dist/SHA256SUMS > dist/SHA256SUMS.sig
          cat update.json dist/SHA256SUMS.sig
      - name: checked with the public key
        if: env.SIGNED == 'true'
        run: |
          # what was signed opens with the key the programs carry: another key in the CI stops the release here (#174)
          ./release-tool verify -pub "$UPDATE_PUBLIC_KEY" -version "$VERSION" -channel "$CHANNEL" -notes release-notes.md -dir dist update.json
          ./release-tool verify-sums -pub "$UPDATE_PUBLIC_KEY" -version "$VERSION" -channel "$CHANNEL" dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$VERSION" in v0.*|*-*) pre=--prerelease ;; esac
          gh release create "$VERSION" dist/celestine-* dist/SHA256SUMS* --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" --notes-file release-notes.md --verify-tag $pre
      - name: install script
        if: env.SIGNED == 'true'
        run: |
          # the install script carries the releases' key, as ssh-keygen reads it, to check SHA256SUMS.sig with (#540)
          key=$(./release-tool sshkey "$UPDATE_PUBLIC_KEY")
          # and the version it is of: it installs none older (#564)
          sed -e "s|@RELEASE_SSH_KEY@|$key|" -e "s|@RELEASE_VERSION@|$VERSION|" scripts/install.sh > install.sh
          grep -q '^KEY=${CELESTINE_KEY:-ssh-ed25519 [A-Za-z0-9+/=]*}$' install.sh || { echo "the key is not in install.sh"; exit 1; }
          grep -qx "FLOOR=$VERSION" install.sh || { echo "the version is not in install.sh"; exit 1; }
      - name: upload to R2
        if: env.SIGNED == 'true' && env.R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EP="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # the builds, then the signed sums that name them: the install script finds both before the version
          for f in dist/celestine-* dist/SHA256SUMS dist/SHA256SUMS.sig; do aws s3 cp "$f" "s3://celestine-releases/$VERSION/$(basename $f)" --endpoint-url "$EP"; done
          # the manifest last: once it is up, every app is offered the version. A trial goes to beta.json alone, which
          # only apps on the trial channel ask for; a stable release goes to both, so those apps are offered it too (#169)
          aws s3 cp update.json s3://celestine-releases/beta.json --endpoint-url "$EP" --content-type application/json
          if [ "$CHANNEL" != beta ]; then
            aws s3 cp update.json s3://celestine-releases/update.json --endpoint-url "$EP" --content-type application/json
          fi
          # the site's changelog after it, so the page never names a version that is not offered yet
          aws s3 cp changelog.json s3://celestine-releases/changelog.json --endpoint-url "$EP" --content-type application/json --cache-control "public, max-age=300"
          # the install script, which the site serves at /install.sh (#514): the one of the version it installs. It
          # installs what update.json names, the stable release, so a trial leaves the stable one's script in place
          if [ "$CHANNEL" != beta ]; then
            aws s3 cp install.sh s3://celestine-releases/install.sh --endpoint-url "$EP" --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"
          fi
