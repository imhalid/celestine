# A tag v1.2.3 makes a release: the five builds (scripts/build.sh, with its size budget), packaged
# (scripts/package.sh: macOS as a zipped celestine.app, Linux also as a .tar.gz with a .desktop file, and
# scripts/appimage.sh: Linux as an AppImage, #513), a SHA256SUMS, a signed manifest, the GitHub release, and then the
# files on Cloudflare R2, from where the app's update check reads them (cloudflare/update/worker.js), and the site's
# download buttons through the Worker's /download: the DMG on macOS, the AppImage on Linux, the .exe on Windows. update.json goes up last: until it is there, no app is offered the version.
# Then the dmg job, on macOS, makes celestine-macos.dmg from the two darwin zips (scripts/dmg.sh) and adds it to
# the release and to R2: the first install, for both Macs (#479). macOS minutes count ten times; it takes a minute or two.
#
# Secrets: RELEASE_KEY (the secret key of `go run ./scripts/release keygen`), UPDATE_PUBLIC_KEY (its public
# half, which goes into the program), UPDATE_URL (the Worker's address, https://…/update.json; the files are served
# beside it), and for R2: CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. Without them the release is
# made all the same, on GitHub alone: the builds do not check for updates, and nothing goes to R2.
#
# A v0.x tag, or one with a "-" (v1.2.0-beta.1), is a prerelease. The notes, on GitHub and in the app's "what's
# new" alike, are the commits since the tag before. changelog.json, every release with its changes, the new apart from
# the fixes and without issue numbers (scripts/release changelog), goes to R2 last: the site's /changelog reads it
# there, with no deploy. An annotated tag gives the release its title and summary on that page:
#   git tag -a v1.2.0 -m "Quieter sync" -m "Sync asks the server less, and ..."
#
# The tests run here only for a commit the nightly has not tested whole: one it has (its status celestine/tests,
# nightly.yml) is not tested again, and the release is its builds alone (#465). To release a fix quickly, run the
# nightly on it by hand (`gh workflow run nightly.yml`) and tag it once that passed.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  statuses: read # whether the nightly tested the commit (tested already)
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      SIGNED: ${{ secrets.RELEASE_KEY != '' }}
      R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: tested already
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the nightly's mark on this very commit: what it tested is not run again
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            --jq '[.[] | select(.context == "celestine/tests")][0].state // ""' 2>/dev/null || true)
          if [ "$state" = success ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "The nightly tested $GITHUB_SHA whole: its tests are not run again."
          else
            echo "The nightly has not tested $GITHUB_SHA: the tests run here."
          fi
      - name: format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: test
        if: steps.tested.outputs.ok != 'true'
        run: go test -timeout 20m ./...
      - name: update address
        if: env.SIGNED == 'true'
        env:
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_PUBLIC_KEY }}
        run: |
          # a signed release with no address or key would sign files no app can find or check
          case "$UPDATE_URL" in https://*/update.json) ;; *) echo "UPDATE_URL is not https://…/update.json"; exit 1 ;; esac
          test -n "$UPDATE_PUBLIC_KEY" || { echo "UPDATE_PUBLIC_KEY is empty"; exit 1; }
          echo "LDFLAGS=-X main.updateURL=$UPDATE_URL -X main.updateKey=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "BASE=${UPDATE_URL%/update.json}/$VERSION" >> "$GITHUB_ENV"
      - name: build
        env:
          BUDGET_MB: 50 # the builds are 27-31 MB (v0.1.0); over this the release stops
        run: |
          scripts/build.sh
          GOOS=js GOARCH=wasm go build -o /dev/null . # the web's build is in the gate too
          ls -l dist
      - name: package
        run: |
          scripts/package.sh
          scripts/appimage.sh
          (cd dist && sha256sum celestine-* > SHA256SUMS && cat SHA256SUMS)
      - name: darwin zips for the dmg job
        uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/celestine-darwin-*.zip
          retention-days: 1
      - name: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "Since $prev:" > release-notes.md
            git log --no-merges --format='- %s' "$prev..$VERSION" >> release-notes.md
          else
            echo "The first release. The latest changes:" > release-notes.md
            git log --no-merges --format='- %s' -40 "$VERSION" >> release-notes.md
          fi
          cat release-notes.md
      - name: changelog
        run: |
          # every release from the tags, for the site's /changelog (src/routes/changelog of the celestine-site repository)
          go run ./scripts/release changelog > changelog.json
          head -c 2000 changelog.json
      - name: manifest
        if: env.SIGNED == 'true'
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          printf '%s\n' "$RELEASE_KEY" > release.key
          go run ./scripts/release manifest -version "$VERSION" -base "$BASE" \
            -notes release-notes.md -key release.key dist/celestine-* > update.json
          rm release.key
          cat update.json
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/celestine-*
            dist/SHA256SUMS
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
      - name: upload to R2
        if: env.SIGNED == 'true' && env.R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EP="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for f in dist/celestine-* dist/SHA256SUMS; do aws s3 cp "$f" "s3://celestine-releases/$VERSION/$(basename $f)" --endpoint-url "$EP"; done
          # the manifest last: once it is up, every app is offered the version
          aws s3 cp update.json s3://celestine-releases/update.json --endpoint-url "$EP" --content-type application/json
          # the site's changelog after it, so the page never names a version that is not offered yet
          aws s3 cp changelog.json s3://celestine-releases/changelog.json --endpoint-url "$EP" --content-type application/json --cache-control "public, max-age=300"
          # the install script, which the site serves at /install.sh (#514): the one of the version it installs
          aws s3 cp scripts/install.sh s3://celestine-releases/install.sh --endpoint-url "$EP" --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"
  dmg:
    needs: build
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
      R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.RELEASE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: darwin, path: dist }
      - name: dmg
        run: scripts/dmg.sh
      - name: add to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" dist/celestine-macos.dmg --clobber
      - name: upload to R2
        if: env.R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          aws s3 cp dist/celestine-macos.dmg "s3://celestine-releases/$VERSION/celestine-macos.dmg" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
