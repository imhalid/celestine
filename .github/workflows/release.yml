# A tag v1.2.3 makes a release: the five builds, packaged (scripts/package.sh: macOS as a zipped ryudit.app, Linux also
# as a .tar.gz with a .desktop file), a signed manifest, and the files put on Cloudflare R2,
# from where the app's update check reads them (cloudflare/update/worker.js).
#
# Secrets: RELEASE_KEY (the secret key of `go run ./scripts/release keygen`), UPDATE_PUBLIC_KEY (its public
# half, which goes into the program), UPDATE_URL (the Worker's address, https://…/update.json), and for R2:
# CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. Without them the release is made all the same, on
# GitHub alone: the builds are not signed for the app's update check, and nothing goes to R2.
#
# A v0.x tag, or one with a "-" (v1.2.0-beta.1), is a prerelease. The notes are the commits since the tag before.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ secrets.RELEASE_KEY != '' }}
      R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: test
        run: go test -timeout 20m ./...
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LDX="-X main.updateURL=${{ secrets.UPDATE_URL }} -X main.updateKey=${{ secrets.UPDATE_PUBLIC_KEY }}"
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=$VERSION $LDX" -o dist/ryudit-$os-$arch$ext .
          done
          ls -l dist
      - name: package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/package.sh
          ls -l dist
      - name: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "Since $prev:" > release-notes.md
            git log --no-merges --format='- %s' "$prev..${{ github.ref_name }}" >> release-notes.md
          else
            echo "The first release. The latest changes:" > release-notes.md
            git log --no-merges --format='- %s' -40 "${{ github.ref_name }}" >> release-notes.md
          fi
          cat release-notes.md
      - name: manifest
        if: env.SIGNED == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEY }}" > release.key
          git log -1 --format=%B > notes.md
          go run ./scripts/release manifest -version ${{ github.ref_name }} -base "https://${{ vars.DOWNLOAD_HOST }}/${{ github.ref_name }}" \
            -notes notes.md -key release.key dist/ryudit-* > dist/update.json
          rm release.key
      - name: upload to R2
        if: env.SIGNED == 'true' && env.R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          EP="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          for f in dist/ryudit-*; do aws s3 cp "$f" "s3://ryudit-releases/${{ github.ref_name }}/$(basename $f)" --endpoint-url "$EP"; done
          aws s3 cp dist/update.json s3://ryudit-releases/update.json --endpoint-url "$EP" --content-type application/json
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/ryudit-*"
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
