    <rect x="277" y="362" width="170" height="380" rx="65" fill="#4A90EA"/>
    <rect x="577" y="302" width="170" height="440" rx="65" fill="#4A90EA"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="237" y="322" width="250" height="460" rx="105" fill="url(#rim)"/>
    <rect x="537" y="262" width="250" height="520" rx="105" fill="url(#rim)"/>
  </g>
  <rect x="277" y="362" width="170" height="380" rx="65" fill="url(#fill)"/>
  <rect x="577" y="302" width="170" height="440" rx="65" fill="url(#fill)"/>
