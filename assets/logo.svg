<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#27352f"/>
      <stop offset="0.45" stop-color="#0f1513"/>
      <stop offset="1" stop-color="#020404"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#3dffb5" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#2fd9a0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <!-- one gradient for the whole cat, so the tufts and the ears are the head's -->
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="330" y1="110" x2="720" y2="840">
      <stop offset="0" stop-color="#f2fff8"/>
      <stop offset="0.25" stop-color="#a6f8d4"/>
      <stop offset="0.55" stop-color="#43e6b4"/>
      <stop offset="0.82" stop-color="#17c0a8"/>
      <stop offset="1" stop-color="#0d95a0"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.62" cy="0.64" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc6df"/>
      <stop offset="1" stop-color="#ff86b6"/>
    </linearGradient>
    <linearGradient id="shade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#03302e" stop-opacity="0"/>
      <stop offset="1" stop-color="#03302e" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tileClip"><rect width="1024" height="1024" rx="232"/></clipPath>
    <path id="head" d="M300 560
        C268 440 300 340 372 290
        L352 142
        C350 124 368 116 382 128
        L506 226
        C566 208 640 212 704 242
        L744 128
        C748 112 768 108 780 124
        L846 262
        C890 326 904 414 890 488
        C886 508 872 522 852 530
        C870 550 868 586 838 608
        C808 632 788 646 772 666
        C722 732 632 794 504 798
        C384 802 316 722 300 560 Z"/>
    <clipPath id="catClip"><use xlink:href="#head"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <ellipse cx="570" cy="570" rx="340" ry="300" fill="#2de6aa" opacity="0.30" filter="url(#soft)"/>
  </g>
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g transform="translate(-52 10) scale(0.98)">
  <!-- the cat: the tufts behind the head, the head, its ears -->
  <g filter="url(#drop)">
    <g fill="url(#fur)">
      <circle cx="292" cy="500" r="58"/>
      <circle cx="304" cy="618" r="54"/>
      <circle cx="368" cy="716" r="50"/>
      <use xlink:href="#head"/>
    </g>
    <use xlink:href="#head" fill="none" stroke="url(#fur)" stroke-width="22" stroke-linejoin="round"/>
  </g>
  <g clip-path="url(#catClip)">
    <rect x="260" y="420" width="700" height="420" fill="url(#shade)"/>
    <ellipse cx="650" cy="600" rx="250" ry="190" fill="url(#cheek)"/>
    <path d="M382 186 L372 262 L462 238 Z" fill="url(#inner)" stroke="url(#inner)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M766 186 L710 246 L800 266 Z" fill="url(#inner)" stroke="url(#inner)" stroke-width="12" stroke-linejoin="round"/>
    <!-- the shine on the forehead -->
    <ellipse cx="520" cy="262" rx="150" ry="44" fill="url(#gloss)" opacity="0.55" filter="url(#blur8)" transform="rotate(-14 520 262)"/>
  </g>

  <!-- the eye -->
  <ellipse cx="636" cy="452" rx="56" ry="74" fill="#04100e"/>
  <ellipse cx="654" cy="420" rx="17" ry="23" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="620" cy="486" rx="9" ry="11" fill="#7ff5cf" opacity="0.55"/>
  <!-- the nose and the mouth -->
  <path d="M852 530 C874 528 888 508 886 492 C868 492 854 508 852 530 Z" fill="#ff86b6"/>
  <path d="M848 562 C824 582 802 588 780 582" fill="none" stroke="#06322e" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
  <g fill="none" stroke="#f2fff8" stroke-opacity="0.88" stroke-width="7" stroke-linecap="round">
    <path d="M802 550 C860 532 926 532 974 550"/>
    <path d="M798 576 C858 572 922 582 962 610"/>
  </g>
  </g>
</svg>
